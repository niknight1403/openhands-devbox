# OpenHands Superagent — mobil startbar, mit isolierten Rollenläufen und Draft-PR
name: OpenHands Task

on:
  schedule:
    - cron: "0 7 * * 1,4"
  workflow_dispatch:
    inputs:
      task:
        description: "Aufgabe in natürlicher Sprache (leer = begrenzter Autonom-Wache-Auftrag)"
        required: false
        default: ""
        type: string
      profile:
        description: "Arbeitsmodus für den Agentenlauf"
        required: true
        default: superagent
        type: choice
        options:
          - superagent
          - implementer
          - frontend
          - security
          - quality
      model:
        description: "LiteLLM-Modell-ID (leer = automatische Gratis-Route)"
        required: false
        default: ""
        type: string
      target:
        description: "Zielprojekt (nur freigegebene Repositories)"
        required: true
        default: Agenten-Villa
        type: choice
        options:
          - Agenten-Villa
          - openhands-devbox
          - LaunchpadControl
          - CyberSarah-Control-Center
          - Agentforge2
          - AGI-Agenten
      client_run:
        description: "Kurz-ID der Android-App für Branch und PR-Zuordnung (leer = Zeitstempel)"
        required: false
        default: ""
        type: string
      project:
        description: "Projekt aus projects/ (setzt Zielrepository und Projekt-Prompt)"
        required: false
        default: ""
        type: string
  # Ein Projekt-Autopilot startet diesen Lauf per workflow_call. Dort gibt es
  # keine Auswahllisten, deshalb sind alle Werte freie Strings und werden im
  # Schritt "Projekt laden" gegen config/targets.txt geprüft.
  workflow_call:
    inputs:
      task:
        description: "Zusatzauftrag (leer = Projekt-Prompt oder Autonom-Wache)"
        required: false
        default: ""
        type: string
      profile:
        description: "Arbeitsmodus (leer = Standardprofil des Projekts)"
        required: false
        default: ""
        type: string
      model:
        required: false
        default: ""
        type: string
      target:
        required: false
        default: ""
        type: string
      project:
        required: false
        default: ""
        type: string
      client_run:
        required: false
        default: ""
        type: string

# Der eingebaute GITHUB_TOKEN bekommt genau die Rechte, die der Abschluss-
# schritt braucht (Branch-Push und Draft-PR). Ein Lauf im eigenen Repository
# funktioniert damit ohne jeden manuell angelegten Token.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openhands-agenten-lauf
  cancel-in-progress: false

jobs:
  openhands:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Devbox-Prompts und Skills auschecken
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false

      # Ein Projekt bringt Zielrepository und Auftrag mit. Die Prüfung gegen
      # config/targets.txt passiert hier, also bevor irgendein Kontingent
      # verbraucht wird und bevor ein fremdes Repository ausgecheckt wird.
      - name: Projekt laden
        env:
          PROJECT_INPUT: ${{ inputs.project }}
          TARGET_INPUT: ${{ inputs.target }}
        run: |
          set -euo pipefail
          freigegeben="$(grep -vE '^[[:space:]]*(#|$)' control/config/targets.txt)"
          projekt_prompt=""
          projekt_kontext=""
          if [ -n "$PROJECT_INPUT" ]; then
            if ! printf '%s' "$PROJECT_INPUT" | grep -Eq '^[a-z0-9][a-z0-9-]{1,40}$'; then
              echo "::error::project darf nur Kleinbuchstaben, Ziffern und - enthalten."
              exit 2
            fi
            ordner="control/projects/$PROJECT_INPUT"
            if [ ! -f "$ordner/project.env" ]; then
              echo "::error::Projekt '$PROJECT_INPUT' ist nicht angelegt ($ordner/project.env fehlt)."
              exit 2
            fi
            # shellcheck disable=SC1090
            . "$ordner/project.env"
            ziel="${TARGET_REPO_SLUG:-}"
            standard_profil="${DEFAULT_PROFILE:-superagent}"
            projekt_prompt="$ordner/PROMPT.md"
            projekt_kontext="$ordner/PROJECT.md"
            # Ein Projekt bestimmt sein Zielrepository selbst. Die Auswahlliste
            # im manuellen Start hat einen festen Standardwert, der hier nur
            # dann stören würde; deshalb gewinnt das Projekt und der
            # abweichende Wunsch wird sichtbar gemeldet.
            if [ -n "${TARGET_INPUT:-}" ] && [ "$TARGET_INPUT" != "$ziel" ]; then
              echo "::warning::Projekt '$PROJECT_INPUT' gehört zu $ziel; der angeforderte Wert '$TARGET_INPUT' wird ignoriert."
            fi
          else
            ziel="${TARGET_INPUT:-Agenten-Villa}"
            standard_profil="superagent"
          fi
          if ! printf '%s\n' "$freigegeben" | grep -Fxq "$ziel"; then
            echo "::error::Zielrepository '$ziel' steht nicht in config/targets.txt."
            exit 2
          fi
          {
            echo "TARGET_REPO=niknight1403/$ziel"
            echo "TARGET_SLUG=$ziel"
            echo "DEFAULT_PROFILE=$standard_profil"
            echo "PROJECT_NAME=$PROJECT_INPUT"
            echo "PROJECT_PROMPT_FILE=$projekt_prompt"
            echo "PROJECT_CONTEXT_FILE=$projekt_kontext"
          } >> "$GITHUB_ENV"
          echo "Projekt: ${PROJECT_INPUT:-keins} | Ziel: niknight1403/$ziel | Profil: $standard_profil"

      - name: Letzten Autopilot-Status laden
        continue-on-error: true
        run: |
          curl -fsSL --max-time 20 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/autopilot/status/status.json" \
            -o "$RUNNER_TEMP/autopilot-status.json" \
            && echo "Autopilot-Status geladen: bereits bestätigte Routen werden zuerst geprüft." \
            || echo "Kein Autopilot-Status vorhanden; Routenwahl ohne Hinweise."

      - name: Zielprojekt auschecken
        id: target_checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: main
          path: workspace
          persist-credentials: false

      - name: agent/*-Branch anlegen
        env:
          CLIENT_RUN_INPUT: ${{ inputs.client_run }}
        run: |
          set -euo pipefail
          CLIENT_RUN="$CLIENT_RUN_INPUT"
          if [ -n "$CLIENT_RUN" ] && ! printf '%s' "$CLIENT_RUN" | grep -Eq '^[A-Za-z0-9_-]{1,32}$'; then
            echo "::error::client_run darf nur Buchstaben, Ziffern, _ und - enthalten (maximal 32 Zeichen)."
            exit 2
          fi
          cd workspace
          git config user.name "OpenHands Agent"
          git config user.email "niknight1403@users.noreply.github.com"
          if [ -n "$CLIENT_RUN" ]; then
            BRANCH="agent/app-$CLIENT_RUN"
          else
            BRANCH="agent/openhands-$(date +%Y%m%d-%H%M%S)"
          fi
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"

      - name: GitHub-Zugang für Push und Draft-PR bestimmen
        id: github_auth
        env:
          PAT: ${{ secrets.OPENHANDS_GH_PAT }}
          BUILTIN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # Der Test-Push ist die ehrliche Pruefung: Er fragt genau die Operation
          # ab, die der Abschluss-Schritt braucht, und veraendert nichts.
          askpass_datei() { # $1 Zielpfad; liest den Token zur Laufzeit aus PROBE_TOKEN
            printf '%s\n' \
              '#!/bin/sh' \
              'case "$1" in' \
              '  *Username*) printf "%s\n" "x-access-token" ;;' \
              '  *Password*) printf "%s\n" "$PROBE_TOKEN" ;;' \
              '  *) exit 1 ;;' \
              'esac' > "$1"
            chmod 700 "$1"
          }
          test_push() { # $1 Token, $2 Bezeichnung
            local token="$1" label="$2" askpass ausgabe
            if [ -z "$token" ]; then
              echo "::warning::${label} ist nicht hinterlegt."
              return 1
            fi
            askpass="$(mktemp)"
            askpass_datei "$askpass"
            if ausgabe="$(PROBE_TOKEN="$token" GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
                 git -c credential.helper= -C workspace push --dry-run origin "HEAD:refs/heads/${BRANCH}" 2>&1)"; then
              rm -f "$askpass"
              echo "Test-Push nach ${TARGET_REPO} bestaetigt (${label})."
              return 0
            fi
            rm -f "$askpass"
            ausgabe="$(printf '%s' "$ausgabe" | sed -E 's/(gh[pousr]_|github_pat_)[A-Za-z0-9_]+/<entfernt>/g' | tail -n1)"
            echo "::warning::${label} kann nicht nach ${TARGET_REPO} pushen: ${ausgabe:-unbekannter Grund}"
            return 1
          }
          SOURCE=""
          if test_push "${PAT:-}" "OPENHANDS_GH_PAT"; then
            SOURCE="OPENHANDS_GH_PAT"
          elif test_push "${BUILTIN_TOKEN:-}" "GITHUB_TOKEN"; then
            SOURCE="GITHUB_TOKEN"
          else
            echo "::error::Kein GitHub-Zugang mit Schreibrecht auf ${TARGET_REPO}; der Lauf stoppt, bevor Modellkontingent verbraucht wird."
            echo "::error::Im eigenen Repository hilft Settings -> Actions -> General -> Workflow permissions (Read and write). Fuer fremde Zielprojekte wird das Repository-Secret OPENHANDS_GH_PAT benoetigt (Fine-grained: Contents und Pull requests, je read and write)."
            exit 1
          fi
          echo "GH_TOKEN_SOURCE=${SOURCE}" >> "$GITHUB_ENV"
          echo "GitHub-Zugang: ${SOURCE}"

      - name: Guardrail-Sanitizer und Routen-Hunter testen
        # Die Tests lesen config/*.json relativ zum Arbeitsverzeichnis; im
        # Kontroll-Checkout liegen sie unter control/.
        working-directory: control
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: OpenHands CLI installieren
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install openhands --python 3.12
          openhands --version

      - name: Skills-Pack in das Zielprojekt übernehmen
        run: |
          mkdir -p workspace/.agents/skills
          cp -a control/.agents/skills/. workspace/.agents/skills/

      - name: Plugin-Packs laut Autopilot-Konfiguration übernehmen
        continue-on-error: true
        working-directory: control
        run: |
          python3 "$GITHUB_WORKSPACE/control/scripts/llm_autopilot.py" \
            --install-packs "$GITHUB_WORKSPACE/workspace/.agents/skills" \
            --status "$RUNNER_TEMP/pack-status.json" \
            --summary

      - name: Aufgabe und Profil vorbereiten
        env:
          TASK_INPUT: ${{ inputs.task }}
          PROFILE_INPUT: ${{ inputs.profile }}
        run: |
          TASK="$TASK_INPUT"
          PROJEKT_PROMPT=""
          PROJEKT_KONTEXT=""
          if [ -n "${PROJECT_PROMPT_FILE:-}" ] && [ -f "${PROJECT_PROMPT_FILE}" ]; then
            PROJEKT_PROMPT="$(cat "${PROJECT_PROMPT_FILE}")"
          fi
          if [ -n "${PROJECT_CONTEXT_FILE:-}" ] && [ -f "${PROJECT_CONTEXT_FILE}" ]; then
            PROJEKT_KONTEXT="$(cat "${PROJECT_CONTEXT_FILE}")"
          fi
          if [ -n "$PROJEKT_PROMPT" ]; then
            if [ -n "$TASK" ]; then
              # Ein eigener Auftrag gilt zusätzlich, ersetzt den Projektauftrag nicht.
              TASK="$TASK"$'\n\n'"--- Projektauftrag ---"$'\n'"$PROJEKT_PROMPT"
            else
              TASK="$PROJEKT_PROMPT"
            fi
          fi
          if [ -n "$PROJEKT_KONTEXT" ]; then
            TASK="$TASK"$'\n\n'"--- Projektkontext ---"$'\n'"$PROJEKT_KONTEXT"
          fi
          if [ -z "$TASK" ]; then
            TASK="Autonom-Wache-Sprint: Halte ${TARGET_REPO} funktionsfähig. Prüfe die vorhandenen Build-, Lint- und Test-Kommandos. Wähle anschließend höchstens 1-3 klar begrenzte Verbesserungen aus echten Projektbedürfnissen, etwa Fehlerkorrektur, Sicherheit, Bedienbarkeit oder sinnvolle Werkzeuge. Ändere keine Workflow- oder Secret-Dateien und pushe nie direkt auf main."
          fi
          echo "Auftrag: ${#TASK} Zeichen."
          PROFILE="${PROFILE_INPUT:-${DEFAULT_PROFILE:-superagent}}"
          case "$PROFILE" in
            superagent|implementer|frontend|security|quality) ;;
            *) echo "::error::Unbekanntes Profil"; exit 2 ;;
          esac
          TASK_B64="$(printf '%s' "$TASK" | base64 -w 0)"
          {
            echo "TASK_B64=$TASK_B64"
            echo "PROFILE=$PROFILE"
          } >> "$GITHUB_ENV"

      - name: Gratis-Route jagen
        id: route
        env:
          MODEL_INPUT: ${{ inputs.model }}
          # Jeder hinterlegte Schlüssel erweitert die Jagd automatisch; fehlende
          # Secrets werden übersprungen, nicht als Fehler behandelt.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          HUNTER_TIMEOUT: "20"
          HUNTER_ALLOW_PAID: "0"
        run: |
          set -euo pipefail
          python3 control/scripts/free_route_hunter.py \
            --report "$RUNNER_TEMP/route-report.json" \
            --status-file "$RUNNER_TEMP/autopilot-status.json" \
            --summary

      - name: Routen-Report bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-report
          path: ${{ runner.temp }}/route-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: OpenHands-Superagent ausführen
        env:
          OPENHANDS_SUPPRESS_BANNER: "1"
          TTY_INTERACTIVE: "0"
          # Ohne diese Schluessel findet der Ersatzversuch im Schritt unten
          # keine echte Alternative und faellt auf die keyless-Route zurueck.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${LLM_MODEL:-}" ] || [ -z "${LLM_API_KEY:-}" ]; then
            echo "::error::Keine geprüfte Modellroute vorhanden; Lauf wird nicht gestartet."
            exit 1
          fi

          TASK="$(printf '%s' "$TASK_B64" | base64 --decode)"
          GUIDANCE="$(cat control/AGENTS.md)"
          BASE_PROMPT="${GUIDANCE}"$'\n\n## Konkreter Nutzerauftrag\n'"${TASK}"$'\n\n## Grenzen dieses Laufs\nArbeite ausschließlich in /workspace. Verwende relevante Skills unter .agents/skills/. Ändere keine Dateien unter .github/workflows/, keine Secrets, .env-Dateien oder Zugangsdaten. Read-only Git-Inspektionen wie status, diff und log sind erlaubt; führe keine Git-Schreibkommandos, gh- oder Veröffentlichungs-Kommandos aus. Der äußere Workflow verwaltet Branch und Draft-PR. Begrenze den Umfang auf maximal drei zusammenhängende Änderungen.'

          ROUTE_RETRIES="${ROUTE_RETRIES:-2}"

          model_failure() {
            local log_path="$1"
            grep -Eq "litellm\.[[:alnum:]_]+Error|no credits remaining|rate.?limit|HTTP/1\.1 429|model_not_found|invalid_api_key" "$log_path"
          }

          # Die OpenHands-CLI endet bei Anbieterfehlern mit Exit 0 und legt den
          # Fehler nur als Ereignis ab. Dieses Skript liest die neuen Ereignisse
          # und meldet per Exit-Code, ob ein Anbieterwechsel helfen kann.
          ereignis_code=0
          pruefe_ereignisse() { # $1 = Stand-Datei vor dem Lauf
            local stand="$1" code=0
            if python3 control/scripts/openhands_events.py --since-state "$stand" > "$RUNNER_TEMP/event-check.log" 2>&1; then
              code=0
            else
              code=$?
            fi
            cat "$RUNNER_TEMP/event-check.log"
            return "$code"
          }

          run_agent() {
            local role="$1"
            local instructions="$2"
            local attempt=0
            local prompt
            local log_path
            local exit_code
            while : ; do
              prompt="${BASE_PROMPT}"$'\n\n## Deine Rolle in diesem Durchlauf\n'"${instructions}"
              log_path="$RUNNER_TEMP/openhands-${role}-${attempt}.log"
              echo "::group::OpenHands-Rolle: ${role} (Route ${LLM_ROUTE_NAME:-unbekannt}, Versuch $((attempt + 1)))"
              stand="$RUNNER_TEMP/openhands-${role}-${attempt}.state"
              python3 control/scripts/openhands_events.py --record "$stand" > /dev/null
              cd workspace
              if openhands --headless --override-with-envs -t "$prompt" >"$log_path" 2>&1; then
                exit_code=0
              else
                exit_code=$?
              fi
              cd "$GITHUB_WORKSPACE"
              echo "::endgroup::"
              sleep 2
              ereignis_code=0
              pruefe_ereignisse "$stand" || ereignis_code=$?
              if [ "$exit_code" -eq 0 ] && [ "$ereignis_code" -eq 0 ] && ! model_failure "$log_path"; then
                return 0
              fi
              # Ein Fehler ohne Routenbezug wird durch einen Anbieterwechsel nicht besser.
              if [ "$ereignis_code" -eq 4 ]; then
                echo "::error::OpenHands-Rolle ${role} scheiterte an einem Fehler ohne Routenbezug; ein Anbieterwechsel hilft hier nicht."
                return 1
              fi
              if [ "$attempt" -ge "$ROUTE_RETRIES" ]; then
                echo "::error::OpenHands-Rolle ${role} fehlgeschlagen; sensible Roh-Logs werden nicht ausgegeben."
                return 1
              fi
              attempt=$((attempt + 1))
              export HUNTER_EXCLUDE="${HUNTER_EXCLUDE:+${HUNTER_EXCLUDE},}${LLM_ROUTE_NAME:-}"
              echo "::warning::Route ${LLM_ROUTE_NAME:-unbekannt} ausgefallen; der Autopilot sucht Ersatz (Versuch ${attempt}/${ROUTE_RETRIES})."
              if ! python3 control/scripts/free_route_hunter.py \
                --env-file "$RUNNER_TEMP/route.env" \
                --shell-export \
                --report "$RUNNER_TEMP/route-report-${role}-${attempt}.json"; then
                echo "::error::Keine Ersatzroute verfuegbar; Rolle ${role} wird abgebrochen."
                echo "::error::Ohne Modellschluessel bleibt nur die schluesselfreie Route pollinations (1 Antwort je 45 s). Hinterlege ein kostenloses Repository-Secret, etwa GROQ_API_KEY, GEMINI_API_KEY oder OPENROUTER_API_KEY."
                return 1
              fi
              . "$RUNNER_TEMP/route.env"
            done
          }

          case "$PROFILE" in
            superagent)
              run_agent architect "Analysiere Aufgabe und Repo. Schreibe einen knappen, ausführbaren Plan ausschließlich nach .openhands-plan.md. Ändere in dieser Phase keinen Produktcode. Nenne betroffene Dateien, Risiken und passende Checks."
              run_agent implementer "Lies .openhands-plan.md. Implementiere den Auftrag vollständig innerhalb des Plans. Verwende vorhandene Projektkonventionen und führe passende Checks aus. Schreibe keinen Commit."
              run_agent reviewer "Prüfe den finalen Diff gegen Nutzerauftrag und .openhands-plan.md. Suche nach bestätigten funktionalen, Sicherheits- und Regressionfehlern. Behebe nur eng begrenzte bestätigte Probleme und führe betroffene Checks erneut aus."
              ;;
            implementer)
              run_agent implementer "Plane kurz intern und setze dann die konkrete Nutzeraufgabe im vorhandenen Stil um. Prüfe den Diff und führe passende vorhandene Tests aus."
              ;;
            frontend)
              run_agent frontend "Fokussiere auf die konkret angefragte Oberfläche. Nutze den Frontend-/UX-Skill, vorhandene Komponenten und responsive Konventionen. Ergänze verständliche Lade-, Leer-, Erfolgs- und Fehlerzustände, wo sie relevant sind. Prüfe die betroffenen Builds oder UI-Checks."
              ;;
            security)
              run_agent security "Fokussiere auf die konkret angefragte Sicherheitsverbesserung. Nutze den Security-Skill. Prüfe geringstmögliche Rechte, Eingaben, Authentifizierung, Secret-Handhabung und sensible Logs. Führe passende Sicherheits- und Regressionchecks aus."
              ;;
            quality)
              run_agent quality "Fokussiere auf Qualität, Stabilität und Fehlerbehebung. Nutze den Quality-Engineering-Skill. Ermittle vorhandene Checks, behebe bestätigte Probleme und führe passende Tests, Lint- und Build-Kommandos aus."
              ;;
          esac


      - name: Geschützte Pfade wiederherstellen
        if: always() && steps.target_checkout.outcome == 'success'
        run: python3 control/scripts/restore-protected-changes.py workspace

      - name: Änderungen als Draft-PR einreichen
        id: draft_pr
        if: success()
        env:
          PAT: ${{ secrets.OPENHANDS_GH_PAT }}
          BUILTIN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Reihenfolge wie in der Vorpruefung: eigener PAT zuerst, sonst der
          # eingebaute GITHUB_TOKEN. Der Wert bleibt in diesem Schritt.
          GH_TOKEN="${PAT:-}"
          if [ -z "$GH_TOKEN" ]; then
            GH_TOKEN="${BUILTIN_TOKEN:-}"
          fi
          export GH_TOKEN
          cd workspace
          cleanup() {
            rm -f "$RUNNER_TEMP/openhands-askpass"
            unset GH_TOKEN PAT BUILTIN_TOKEN || true
          }
          trap cleanup EXIT
          if [ -z "$(git status --porcelain)" ]; then
            echo "OpenHands hat keine PR-fähigen Änderungen hinterlassen."
            echo "PR_URL=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git commit -m "openhands: ${PROFILE} development update"
          cat > "$RUNNER_TEMP/openhands-askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "x-access-token" ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$RUNNER_TEMP/openhands-askpass"
          GIT_ASKPASS="$RUNNER_TEMP/openhands-askpass" GIT_TERMINAL_PROMPT=0 git push origin "$BRANCH"
          PR_URL="$(gh pr create \
            --repo "$TARGET_REPO" \
            --base main --head "$BRANCH" --draft \
            --title "OpenHands: ${PROFILE} development update" \
            --body "Automatisch von der OpenHands Devbox erstellt. Profil: ${PROFILE}. Keine Aufgabeninhalte in PR-Metadaten. Bitte Änderungen und Tests vor dem Merge prüfen.")"
          echo "PR_URL=$PR_URL" >> "$GITHUB_OUTPUT"
          {
            echo "### OpenHands-Lauf"
            echo ""
            echo "- Zielprojekt: \`$TARGET_REPO\`"
            echo "- Profil: \`$PROFILE\`"
            echo "- Modellroute: \`${LLM_MODEL}\` (${LLM_ROUTE_NAME:-unbekannt})"
            echo "- Branch: \`$BRANCH\`"
            echo "- Draft-PR: $PR_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lauf-Zusammenfassung
        if: always()
        run: |
          {
            echo "### Ergebnis"
            echo ""
            echo "- Zielprojekt: \`$TARGET_REPO\`"
            echo "- Branch: \`${BRANCH:-nicht angelegt}\`"
            echo "- Modellroute: \`${LLM_MODEL:-keine}\`${LLM_ROUTE_NAME:+ (${LLM_ROUTE_NAME})}"
            echo "- GitHub-Zugang: \`${GH_TOKEN_SOURCE:-nicht geprueft}\`"
            echo "- Draft-PR: ${{ steps.draft_pr.outputs.PR_URL || 'keiner erstellt' }}"
          } >> "$GITHUB_STEP_SUMMARY"
