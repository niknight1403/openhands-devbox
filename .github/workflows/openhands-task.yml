# OpenHands Superagent — mobil startbar, mit isolierten Rollenläufen und Draft-PR
name: OpenHands Task

on:
  schedule:
    - cron: "0 7 * * 1,4"
  workflow_dispatch:
    inputs:
      task:
        description: "Aufgabe in natürlicher Sprache (leer = begrenzter Autonom-Wache-Auftrag)"
        required: false
        default: ""
        type: string
      profile:
        description: "Arbeitsmodus für den Agentenlauf"
        required: true
        default: superagent
        type: choice
        options:
          - superagent
          - implementer
          - frontend
          - security
          - quality
      model:
        description: "LiteLLM-Modell-ID (leer = automatische Gratis-Route)"
        required: false
        default: ""
        type: string
      target:
        description: "Zielprojekt (nur freigegebene Repositories)"
        required: true
        default: Agenten-Villa
        type: choice
        options:
          - Agenten-Villa
          - openhands-devbox
          - LaunchpadControl
          - CyberSarah-Control-Center
          - Agentforge2
          - AGI-Agenten
      client_run:
        description: "Kurz-ID der Android-App für Branch und PR-Zuordnung (leer = Zeitstempel)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: openhands-agenten-lauf
  cancel-in-progress: false

jobs:
  openhands:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_REPO: niknight1403/${{ inputs.target || 'Agenten-Villa' }}
    steps:
      - name: Devbox-Prompts und Skills auschecken
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false

      - name: Zielprojekt auschecken
        id: target_checkout
        uses: actions/checkout@v4
        with:
          repository: niknight1403/${{ inputs.target || 'Agenten-Villa' }}
          ref: main
          path: workspace
          persist-credentials: false

      - name: agent/*-Branch anlegen
        env:
          CLIENT_RUN_INPUT: ${{ inputs.client_run }}
        run: |
          set -euo pipefail
          CLIENT_RUN="$CLIENT_RUN_INPUT"
          if [ -n "$CLIENT_RUN" ] && ! printf '%s' "$CLIENT_RUN" | grep -Eq '^[A-Za-z0-9_-]{1,32}$'; then
            echo "::error::client_run darf nur Buchstaben, Ziffern, _ und - enthalten (maximal 32 Zeichen)."
            exit 2
          fi
          cd workspace
          git config user.name "OpenHands Agent"
          git config user.email "niknight1403@users.noreply.github.com"
          if [ -n "$CLIENT_RUN" ]; then
            BRANCH="agent/app-$CLIENT_RUN"
          else
            BRANCH="agent/openhands-$(date +%Y%m%d-%H%M%S)"
          fi
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"

      - name: Guardrail-Sanitizer und Routen-Hunter testen
        run: python3 -m unittest discover -s control/tests -p 'test_*.py' -v

      - name: OpenHands CLI installieren
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install openhands --python 3.12
          openhands --version

      - name: Skills-Pack in das Zielprojekt übernehmen
        run: |
          mkdir -p workspace/.agents/skills
          cp -a control/.agents/skills/. workspace/.agents/skills/

      - name: Aufgabe und Profil vorbereiten
        env:
          TASK_INPUT: ${{ inputs.task }}
          PROFILE_INPUT: ${{ inputs.profile }}
        run: |
          TASK="$TASK_INPUT"
          if [ -z "$TASK" ]; then
            TASK="Autonom-Wache-Sprint: Halte ${TARGET_REPO} funktionsfähig. Prüfe die vorhandenen Build-, Lint- und Test-Kommandos. Wähle anschließend höchstens 1-3 klar begrenzte Verbesserungen aus echten Projektbedürfnissen, etwa Fehlerkorrektur, Sicherheit, Bedienbarkeit oder sinnvolle Werkzeuge. Ändere keine Workflow- oder Secret-Dateien und pushe nie direkt auf main."
          fi
          PROFILE="${PROFILE_INPUT:-superagent}"
          case "$PROFILE" in
            superagent|implementer|frontend|security|quality) ;;
            *) echo "::error::Unbekanntes Profil"; exit 2 ;;
          esac
          TASK_B64="$(printf '%s' "$TASK" | base64 -w 0)"
          {
            echo "TASK_B64=$TASK_B64"
            echo "PROFILE=$PROFILE"
          } >> "$GITHUB_ENV"

      - name: Gratis-Route jagen
        id: route
        env:
          MODEL_INPUT: ${{ inputs.model }}
          # Jeder hinterlegte Schlüssel erweitert die Jagd automatisch; fehlende
          # Secrets werden übersprungen, nicht als Fehler behandelt.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          HUNTER_TIMEOUT: "20"
          HUNTER_ALLOW_PAID: "0"
        run: |
          set -euo pipefail
          python3 control/scripts/free_route_hunter.py \
            --report "$RUNNER_TEMP/route-report.json" \
            --summary

      - name: Routen-Report bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-report
          path: ${{ runner.temp }}/route-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: OpenHands-Superagent ausführen
        env:
          OPENHANDS_SUPPRESS_BANNER: "1"
          TTY_INTERACTIVE: "0"
        run: |
          set -euo pipefail
          if [ -z "${LLM_MODEL:-}" ] || [ -z "${LLM_API_KEY:-}" ]; then
            echo "::error::Keine geprüfte Modellroute vorhanden; Lauf wird nicht gestartet."
            exit 1
          fi

          TASK="$(printf '%s' "$TASK_B64" | base64 --decode)"
          GUIDANCE="$(cat control/AGENTS.md)"
          BASE_PROMPT="${GUIDANCE}"$'\n\n## Konkreter Nutzerauftrag\n'"${TASK}"$'\n\n## Grenzen dieses Laufs\nArbeite ausschließlich in /workspace. Verwende relevante Skills unter .agents/skills/. Ändere keine Dateien unter .github/workflows/, keine Secrets, .env-Dateien oder Zugangsdaten. Read-only Git-Inspektionen wie status, diff und log sind erlaubt; führe keine Git-Schreibkommandos, gh- oder Veröffentlichungs-Kommandos aus. Der äußere Workflow verwaltet Branch und Draft-PR. Begrenze den Umfang auf maximal drei zusammenhängende Änderungen.'

          run_agent() {
            local role="$1"
            local instructions="$2"
            local prompt
            local log_path="$RUNNER_TEMP/openhands-${role}.log"
            local exit_code=0
            prompt="${BASE_PROMPT}"$'\n\n## Deine Rolle in diesem Durchlauf\n'"${instructions}"
            echo "::group::OpenHands-Rolle: ${role}"
            cd workspace
            if openhands --headless --override-with-envs -t "$prompt" >"$log_path" 2>&1; then
              exit_code=0
            else
              exit_code=$?
            fi
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
            if [ "$exit_code" -ne 0 ] || grep -Eq "litellm\.[[:alnum:]_]+Error|no credits remaining" "$log_path"; then
              echo "::error::OpenHands-Rolle ${role} fehlgeschlagen; sensible Roh-Logs werden nicht ausgegeben."
              return 1
            fi
          }

          case "$PROFILE" in
            superagent)
              run_agent architect "Analysiere Aufgabe und Repo. Schreibe einen knappen, ausführbaren Plan ausschließlich nach .openhands-plan.md. Ändere in dieser Phase keinen Produktcode. Nenne betroffene Dateien, Risiken und passende Checks."
              run_agent implementer "Lies .openhands-plan.md. Implementiere den Auftrag vollständig innerhalb des Plans. Verwende vorhandene Projektkonventionen und führe passende Checks aus. Schreibe keinen Commit."
              run_agent reviewer "Prüfe den finalen Diff gegen Nutzerauftrag und .openhands-plan.md. Suche nach bestätigten funktionalen, Sicherheits- und Regressionfehlern. Behebe nur eng begrenzte bestätigte Probleme und führe betroffene Checks erneut aus."
              ;;
            implementer)
              run_agent implementer "Plane kurz intern und setze dann die konkrete Nutzeraufgabe im vorhandenen Stil um. Prüfe den Diff und führe passende vorhandene Tests aus."
              ;;
            frontend)
              run_agent frontend "Fokussiere auf die konkret angefragte Oberfläche. Nutze den Frontend-/UX-Skill, vorhandene Komponenten und responsive Konventionen. Ergänze verständliche Lade-, Leer-, Erfolgs- und Fehlerzustände, wo sie relevant sind. Prüfe die betroffenen Builds oder UI-Checks."
              ;;
            security)
              run_agent security "Fokussiere auf die konkret angefragte Sicherheitsverbesserung. Nutze den Security-Skill. Prüfe geringstmögliche Rechte, Eingaben, Authentifizierung, Secret-Handhabung und sensible Logs. Führe passende Sicherheits- und Regressionchecks aus."
              ;;
            quality)
              run_agent quality "Fokussiere auf Qualität, Stabilität und Fehlerbehebung. Nutze den Quality-Engineering-Skill. Ermittle vorhandene Checks, behebe bestätigte Probleme und führe passende Tests, Lint- und Build-Kommandos aus."
              ;;
          esac

          python3 - <<'PY'
          import glob, json, re, sys
          REDAKTION = re.compile(r"(sk-|ghp_|github_pat_)[A-Za-z0-9_-]+|[A-Za-z0-9_-]{32,}")
          errors = []
          for path in glob.glob("/home/runner/.openhands/conversations/*/events/*.json"):
              try:
                  with open(path, encoding="utf-8") as stream:
                      event = json.load(stream)
              except (OSError, json.JSONDecodeError):
                  continue
              if event.get("kind") == "ConversationErrorEvent":
                  code = str(event.get("code", "Unbekannt"))
                  detail = REDAKTION.sub("<entfernt>", str(event.get("detail", "")))[:400]
                  errors.append((code, detail))
          if errors:
              for code, detail in errors:
                  print(f"::error::OpenHands-Fehler {code}: {detail}")
              print(f"::error::OpenHands meldete {len(errors)} Fehler.")
              sys.exit(1)
          print("OpenHands-Event-Prüfung abgeschlossen.")
          PY

      - name: Geschützte Pfade wiederherstellen
        if: always() && steps.target_checkout.outcome == 'success'
        run: python3 control/scripts/restore-protected-changes.py workspace

      - name: Änderungen als Draft-PR einreichen
        id: draft_pr
        if: success()
        env:
          GH_TOKEN: ${{ secrets.OPENHANDS_GH_PAT }}
        run: |
          set -euo pipefail
          cd workspace
          cleanup() {
            rm -f "$RUNNER_TEMP/openhands-askpass"
            unset GH_TOKEN || true
          }
          trap cleanup EXIT
          if [ -z "$(git status --porcelain)" ]; then
            echo "OpenHands hat keine PR-fähigen Änderungen hinterlassen."
            echo "PR_URL=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git commit -m "openhands: ${PROFILE} development update"
          cat > "$RUNNER_TEMP/openhands-askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "x-access-token" ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$RUNNER_TEMP/openhands-askpass"
          GIT_ASKPASS="$RUNNER_TEMP/openhands-askpass" GIT_TERMINAL_PROMPT=0 git push origin "$BRANCH"
          PR_URL="$(gh pr create \
            --repo "$TARGET_REPO" \
            --base main --head "$BRANCH" --draft \
            --title "OpenHands: ${PROFILE} development update" \
            --body "Automatisch von der OpenHands Devbox erstellt. Profil: ${PROFILE}. Keine Aufgabeninhalte in PR-Metadaten. Bitte Änderungen und Tests vor dem Merge prüfen.")"
          echo "PR_URL=$PR_URL" >> "$GITHUB_OUTPUT"
          {
            echo "### OpenHands-Lauf"
            echo ""
            echo "- Zielprojekt: \`$TARGET_REPO\`"
            echo "- Profil: \`$PROFILE\`"
            echo "- Modellroute: \`${LLM_MODEL}\` (${LLM_ROUTE_NAME:-unbekannt})"
            echo "- Branch: \`$BRANCH\`"
            echo "- Draft-PR: $PR_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lauf-Zusammenfassung
        if: always()
        run: |
          {
            echo "### Ergebnis"
            echo ""
            echo "- Zielprojekt: \`$TARGET_REPO\`"
            echo "- Branch: \`${BRANCH:-nicht angelegt}\`"
            echo "- Modellroute: \`${LLM_MODEL:-keine}\`${LLM_ROUTE_NAME:+ (${LLM_ROUTE_NAME})}"
            echo "- Draft-PR: ${{ steps.draft_pr.outputs.PR_URL || 'keiner erstellt' }}"
          } >> "$GITHUB_STEP_SUMMARY"
