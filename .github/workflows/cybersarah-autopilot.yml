# CyberSarah Control Center: ein Lauf pro Tag, der das Projekt analysiert und
# danach schrittweise optimiert. Der Auftrag selbst steht in
# projects/cybersarah-control-center/PROMPT.md, damit er ohne Workflow-Änderung
# gepflegt werden kann.
name: CyberSarah Autopilot

on:
  schedule:
    # Täglicher Lauf, gleiche Kadenz wie in projects/cybersarah-control-center/project.env.
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "Zusatzauftrag für diesen Lauf (leer = Projektauftrag)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

# Eigene Gruppe, nicht die des aufgerufenen Workflows: teilen sich Aufrufer und
# aufgerufener Workflow eine Gruppe, bricht GitHub den Lauf als Deadlock ab.
concurrency:
  group: cybersarah-autopilot
  cancel-in-progress: false

jobs:
  cybersarah:
    uses: ./.github/workflows/openhands-task.yml
    secrets: inherit
    with:
      # Nur das Projekt: Zielrepository und Auftrag kommen aus projects/.
      project: cybersarah-control-center
