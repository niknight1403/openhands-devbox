# Baut die OpenHands-Steuer-App als installierbares APK
name: Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release version (e.g. v1.3.0-android); empty builds artifact only'
        required: false
        type: string
  push:
    branches:
      - main
      - "agent/**"
    tags:
      - "v*"
    paths:
      - "android/**"
      - "scripts/android_release_tag.py"
      - "tests/test_android_release_tag.py"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Devbox-Skripte testen
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android-SDK prüfen
        run: |
          set -euo pipefail
          # Der Runner liefert das SDK bereits mit; setup-android@v3 scheitert dort am
          # entfernten Paket 'tools'. Fehlende Bestandteile werden direkt nachgezogen.
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK: $SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          echo "sdkmanager: ${SDKMANAGER:-nicht gefunden}"
          if [ -n "$SDKMANAGER" ]; then
            (yes | "$SDKMANAGER" --licenses >/dev/null 2>&1) || true
            "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          else
            echo "::warning::sdkmanager nicht gefunden, vorhandenes SDK wird genutzt"
          fi
          ls "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools" || true

      - name: Debug-APK bauen
        working-directory: android
        run: ./gradlew --no-daemon --console=plain assembleDebug

      - name: APK als Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: openhands-devbox-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Release mit APK veröffentlichen
        if: >-
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(android): v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ inputs.release_tag || github.ref_name }}"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            RELEASE_TAG="$(python3 scripts/android_release_tag.py "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_EVENT_PATH")"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-android$ ]]; then
            echo "::error::Release tag must match vMAJOR.MINOR.PATCH-android"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists"
            exit 1
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "openhands-devbox-${RELEASE_TAG}.apk"
          gh release create "$RELEASE_TAG" "openhands-devbox-${RELEASE_TAG}.apk" \
            --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenHands Devbox ${RELEASE_TAG}" \
            --notes "Debug-APK der OpenHands-Steuer-App. Installation über Android-Einstellungen (unbekannte Quellen) erlauben."
