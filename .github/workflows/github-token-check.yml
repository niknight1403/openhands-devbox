# Prüft autonom, welcher GitHub-Zugang für Branch-Push und Draft-PR wirklich taugt.
# Läuft wöchentlich und auf Knopfdruck; zeigt HTTP-Codes, nie Tokenwerte.
name: GitHub Token Check

on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

# Gleiche Rechte wie im Agentenlauf, damit der eingebaute Token realistisch
# geprüft wird. Der Check selbst schreibt nichts ins Repository.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: github-token-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAT: ${{ secrets.OPENHANDS_GH_PAT }}
      BUILTIN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_REPOS: "openhands-devbox Agenten-Villa LaunchpadControl CyberSarah-Control-Center Agentforge2 AGI-Agenten"
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Konfigurationstests ausführen
        run: python3 -m unittest discover -s tests -p 'test_github_token_config.py' -v

      - name: Zugänge prüfen
        run: |
          set -uo pipefail
          summary="$RUNNER_TEMP/github-token-check.md"

          askpass_datei() { # $1 Zielpfad; liest den Token zur Laufzeit aus PROBE_TOKEN
            printf '%s\n' \
              '#!/bin/sh' \
              'case "$1" in' \
              '  *Username*) printf "%s\n" "x-access-token" ;;' \
              '  *Password*) printf "%s\n" "$PROBE_TOKEN" ;;' \
              '  *) exit 1 ;;' \
              'esac' > "$1"
            chmod 700 "$1"
          }

          probe() { # $1 Token, $2 Repository -> setzt PROBE_CODE und PROBE_PUSH
            local response
            response="$(curl -sS --max-time 20 -w '\n%{http_code}' \
              -H "Authorization: Bearer $1" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$2")" || response=$'\n000'
            PROBE_CODE="$(printf '%s' "$response" | tail -n1)"
            if printf '%s' "$response" | sed '$d' | grep -Eq '"push":[[:space:]]*true'; then
              PROBE_PUSH="ja"
            else
              PROBE_PUSH="nein"
            fi
          }

          identity() { # $1 Token -> Anmeldename oder Fehlerhinweis
            local response code login
            response="$(curl -sS --max-time 20 -w '\n%{http_code}' \
              -H "Authorization: Bearer $1" https://api.github.com/user)" || response=$'\n000'
            code="$(printf '%s' "$response" | tail -n1)"
            if [ "$code" = "200" ]; then
              login="$(printf '%s' "$response" | sed '$d' | sed -n 's/.*"login":[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)"
              echo "${login:-unbekannt}"
            else
              echo "nicht abfragbar (HTTP ${code})"
            fi
          }

          # Der eingebaute Token lässt sich nicht am Repository-Objekt ablesen:
          # dort steht das Recht des Aufrufers, nicht das des Workflow-Tokens.
          # Ein echter Test-Push auf einen Wegwerf-Ref zeigt das Schreibrecht,
          # ohne das Repository zu verändern.
          builtin_push="nein"
          if [ -n "${BUILTIN_TOKEN:-}" ]; then
            askpass="$(mktemp)"
            askpass_datei "$askpass"
            if PROBE_TOKEN="$BUILTIN_TOKEN" GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
                 git -c credential.helper= push --dry-run origin "HEAD:refs/heads/token-check-probe" >/dev/null 2>&1; then
              builtin_push="ja"
            fi
            rm -f "$askpass"
          fi
          echo "Diagnose GITHUB_TOKEN, Rechte laut Repository-Objekt:"
          curl -sS --max-time 20 -H "Authorization: Bearer ${BUILTIN_TOKEN:-}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
            | sed -n '/"permissions"/,/}/p' | head -n 12 || true

          failures=0
          {
            echo "### GitHub-Zugänge"
            echo ""
            echo "| Zugang | Repository | Schreibrecht | Hinweis |"
            echo "| --- | --- | --- | --- |"
            printf '| %s | %s | %s | %s |\n' "GITHUB_TOKEN" "eigenes Repository (Test-Push)" "$builtin_push" "gilt nur hier"
          } > "$summary"

          if [ "$builtin_push" = "ja" ]; then
            echo "Eingebauter GITHUB_TOKEN: Schreibrecht auf ${GITHUB_REPOSITORY} bestätigt."
          else
            echo "::error::Der eingebaute GITHUB_TOKEN kann nicht in ${GITHUB_REPOSITORY} schreiben. Prüfe Settings -> Actions -> General -> Workflow permissions (Read and write)."
            failures=$((failures + 1))
          fi

          if [ -n "${PAT:-}" ]; then
            echo "OPENHANDS_GH_PAT angemeldet als: $(identity "$PAT")"
            pat_writable=0
            pat_denied=0
            for repo in $TARGET_REPOS; do
              full="niknight1403/${repo}"
              probe "$PAT" "$full"
              if [ "$PROBE_CODE" = "200" ] && [ "$PROBE_PUSH" = "ja" ]; then
                pat_writable=$((pat_writable + 1))
                printf '| %s | %s | %s | %s |\n' "OPENHANDS_GH_PAT" "$full" "ja" "HTTP 200" >> "$summary"
              else
                pat_denied=$((pat_denied + 1))
                printf '| %s | %s | %s | %s |\n' "OPENHANDS_GH_PAT" "$full" "nein" "HTTP ${PROBE_CODE}" >> "$summary"
              fi
            done
            if [ "$pat_writable" -eq 0 ]; then
              echo "::error::OPENHANDS_GH_PAT hat auf keinem freigegebenen Repository Schreibrecht. Laeufe im eigenen Repository fallen auf den eingebauten GITHUB_TOKEN zurueck; fremde Zielprojekte schlagen fehl."
              failures=$((failures + 1))
            elif [ "$pat_denied" -gt 0 ]; then
              echo "::warning::OPENHANDS_GH_PAT hat auf ${pat_denied} der freigegebenen Repositories kein Schreibrecht."
            fi
            {
              echo ""
              echo "Der PAT deckt die fremden Zielprojekte ab; im eigenen Repository greift zuerst ebenfalls der PAT, sonst der eingebaute Token."
            } >> "$summary"
          else
            echo "::notice::Kein OPENHANDS_GH_PAT hinterlegt. Laeufe im eigenen Repository funktionieren mit dem eingebauten GITHUB_TOKEN; fremde Zielprojekte brauchen das Secret."
            {
              echo ""
              echo "Kein OPENHANDS_GH_PAT hinterlegt: Das eigene Repository läuft mit dem eingebauten Token, fremde Zielprojekte brauchen weiterhin den PAT."
            } >> "$summary"
          fi

          {
            echo ""
            echo "Regel: eigener PAT zuerst, sonst der eingebaute GITHUB_TOKEN. Der Agentenlauf prüft die Reihenfolge per Test-Push vor dem ersten Modellaufruf und bricht bei fehlendem Schreibrecht sofort ab."
          } >> "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          exit "$failures"

      - name: Bericht als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-token-check
          path: ${{ runner.temp }}/github-token-check.md
          if-no-files-found: ignore
          retention-days: 14
