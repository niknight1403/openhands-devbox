# Hält die kostenlosen Modell-, Werkzeug- und Skill-Routen dauerhaft aktuell
name: LLM Autopilot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      tool_probe:
        description: "Werkzeugrouten wirklich testen"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: llm-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Autopilot-Tests ausführen
        run: python3 -m unittest discover -s tests -p 'test_llm_autopilot.py' -v

      - name: Routen jagen und Werkzeugrouten prüfen
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOPILOT_CATALOG_URLS: ${{ vars.AUTOPILOT_CATALOG_URLS }}
          AUTOPILOT_MAX_ROUTES: "24"
          AUTOPILOT_TOOL_PROBE: ${{ inputs.tool_probe == false && '0' || '1' }}
          AUTOPILOT_TIMEOUT: "20"
        run: |
          set -euo pipefail
          python3 scripts/llm_autopilot.py --status llm-route-status.json --summary

      - name: Status als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-route-status
          path: llm-route-status.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Status auf den Branch autopilot/status veröffentlichen
        if: always() && hashFiles('llm-route-status.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/status-publish"
          mkdir -p "$WORK"
          cp llm-route-status.json "$WORK/status.json"
          cd "$WORK"
          git init -q
          git config user.name "LLM Autopilot"
          git config user.email "niknight1403@users.noreply.github.com"
          git add status.json
          git commit -q -m "autopilot: Routenstatus $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BASE64_TOKEN="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c http.extraheader="AUTHORIZATION: basic ${BASE64_TOKEN}" \
            push --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/autopilot/status
          {
            echo ""
            echo "Status veröffentlicht: Branch \`autopilot/status\`, Datei \`status.json\`."
          } >> "$GITHUB_STEP_SUMMARY"
