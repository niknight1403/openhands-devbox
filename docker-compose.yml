# OpenHands Agent Canvas im Codespace mit verpflichtendem Backend-API-Key
services:
  openhands:
    image: ghcr.io/openhands/agent-canvas:1.26.0
    container_name: openhands-agent-canvas
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Der Key wird lokal in der ignorierten .env erzeugt; kein LAN-Session-Key im HTML.
      LOCAL_BACKEND_API_KEY: ${LOCAL_BACKEND_API_KEY:?Starte bash scripts/bootstrap-codespace.sh}
      PROJECTS_PATH: /workspaces/openhands-devbox
      LLM_API_KEY: ${OPENROUTER_API_KEY:-}
      LOG_LEVEL: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Gleicher absoluter Pfad in Codespace-Host und Canvas-Container für Docker-Sandbox-Mounts.
      - .:/workspaces/openhands-devbox
      - openhands_state:/home/openhands/.openhands
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  openhands_state:
