# OpenHands im GitHub Codespace — startet automatisch beim Codespace-Start
services:
  openhands:
    image: ghcr.io/all-hands-ai/openhands:latest
    container_name: openhands-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - LOG_LEVEL=info
      # Kostenlose Modellroute: OpenRouter Free (Key als Codespace-Secret OPENROUTER_API_KEY)
      - LLM_API_KEY=${OPENROUTER_API_KEY:-}
      - LLM_BASE_URL=https://openrouter.ai/api/v1
      # PAT mit repo-Rechten als Codespace-Secret OPENHANDS_GH_PAT
      - GITHUB_TOKEN=${OPENHANDS_GH_PAT:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./openhands-state:/.openhands-state
    extra_hosts:
      - "host.docker.internal:host-gateway"
